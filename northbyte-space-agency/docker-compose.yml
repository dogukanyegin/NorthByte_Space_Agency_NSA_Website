services:
  nsa:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      - NSA_DB_PATH=/app/data/nsa.db
    volumes:
      - nsa-data:/app/data
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  nsa-data:
